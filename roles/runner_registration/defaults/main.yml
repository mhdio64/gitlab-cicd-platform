---
# Defaults for runner_registration role

# Target GitLab Instance URL
runner_registration_coordinator_url: "{{ gitlab_runner_coordinator_url | default('https://gitlab.example.com') }}"

# Modern Runner Authentication Token (glrt-...)
runner_registration_auth_token: >-
  {{ (vault_gitlab_runner_auth_tokens[inventory_hostname] | default(''))
     if (vault_gitlab_runner_auth_tokens is defined and inventory_hostname in vault_gitlab_runner_auth_tokens)
     else (gitlab_runner_auth_token | default('')) }}

# Runner Identity & Profile
runner_registration_name: "{{ gitlab_runner_name | default(inventory_hostname) }}"
runner_registration_profile: "{{ gitlab_runner_profile | default('general') }}"
runner_registration_tags: "{{ gitlab_runner_tags | default([]) }}"
runner_registration_executor: "{{ gitlab_runner_executor | default('docker') }}"
runner_registration_default_image: "{{ gitlab_runner_default_image | default('alpine:3.21') }}"

# Security baseline
runner_registration_privileged: "{{ gitlab_runner_privileged | default(false) }}"
runner_registration_protected: "{{ gitlab_runner_protected | default(false) }}"
runner_registration_run_untagged: "{{ gitlab_runner_run_untagged | default(true) }}"
runner_registration_locked: "{{ gitlab_runner_locked | default(false) }}"

# Concurrency & Performance
runner_registration_concurrency: "{{ gitlab_runner_concurrency | default(4) }}"
runner_registration_check_interval: "{{ gitlab_runner_check_interval | default(5) }}"
runner_registration_pull_policy: "{{ gitlab_runner_pull_policy | default(['always']) }}"
runner_registration_volumes: "{{ gitlab_runner_docker_volumes | default(['/cache']) }}"
runner_registration_docker_memory: "{{ gitlab_runner_docker_memory | default('') }}"
runner_registration_docker_cpus: "{{ gitlab_runner_docker_cpus | default('') }}"
