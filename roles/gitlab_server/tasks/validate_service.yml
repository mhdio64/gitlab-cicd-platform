---
# Task: Validate GitLab service health and readiness

- name: Check GitLab services status via gitlab-ctl
  ansible.builtin.command:
    cmd: "gitlab-ctl status"
  register: gitlab_server_status_output
  changed_when: false

- name: Display GitLab services status
  ansible.builtin.debug:
    var: gitlab_server_status_output.stdout_lines

- name: Wait for GitLab web service readiness
  ansible.builtin.uri:
    url: "{{ gitlab_server_external_url }}/users/sign_in"
    method: GET
    status_code:
      - 200
      - 302
    validate_certs: "{{ gitlab_server_tls_mode != 'custom' }}"
  register: gitlab_server_health_response
  until: gitlab_server_health_response.status in [200, 302]
  retries: "{{ (gitlab_server_health_check_timeout | int // gitlab_server_health_check_delay | int) }}"
  delay: "{{ gitlab_server_health_check_delay }}"
  when: not (ansible_check_mode | bool)

- name: Confirm GitLab Server is functional
  ansible.builtin.debug:
    msg: "GitLab Server is online and responsive at {{ gitlab_server_external_url }}"
